# Explicit rule families, minus three that disagree with this project's
# style rather than finding defects in it. This is a ruleset decision, not a
# baseline: there is no list of grandfathered violations anywhere, and every
# rule left enabled passes on the whole tree.
#
#   E701/E702  paired statements on one line. The test suites write setup as
#              `hub_dir.mkdir(); cache.mkdir()` deliberately -- the pairing is
#              the point, and splitting them reads worse.
#   E401       combined imports (`import pytest, helpmate`). Same reasoning.
#
# Measured on the v0.7.1 tree: enabling these three would flag 55 lines, none
# of which is a defect.
#
# `select` is used instead of inheriting ruff's default rule set on purpose:
# ruff 0.16.1 (up from 0.15.7) changed its defaults to add I001 (import
# sorting), pyupgrade's UP*, blind-except BLE001, FA*, SIM*, PLW*, RUF* and
# FURB* -- a purely upstream decision that would otherwise have silently
# expanded what this gate enforces and broken CI on unrelated PRs (see
# .github/workflows/ci.yml's tool-version pin comment for the incident).
# E4/E7/E9/F is the set that has been validated clean here; adding a new
# family is a deliberate choice made in a commit of its own, not something
# that happens for free on a ruff upgrade. In particular the 0.16 defaults
# are NOT adopted: they are style opinions, and I001 alone would churn 23
# import blocks for no functional gain.
line-length = 100
target-version = "py39"

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E401"]

[format]
# `ruff format` is deliberately NOT adopted: on the v0.7.1 tree it rewrites
# 1101 lines across 23 files to impose its spacing on code written compactly
# on purpose. Style here is settled by review.
exclude = ["*"]
