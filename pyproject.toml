[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "helpmate"
version = "0.7.1"
description = "Helpmate tablebases: cooperative mate distances and solution counts"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest", "chess>=1.10"]

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["src/packages/bindings/helpmate"]
cmake.define.HELPMATE_PYTHON = "ON"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true          # helpmate is a compiled extension
follow_imports = "normal"
files = ["src/packages/api/helpmate_server"]

# This machine's shared site-packages (used by several unrelated projects,
# not a venv scoped to helpmate-api) currently holds fastapi/starlette/anyio
# builds whose own `Requires-Python` is >=3.10, and huggingface_hub's
# __init__.py eagerly re-imports its whole public surface under
# `if TYPE_CHECKING` (for static analysis), reaching its optional
# huggingface_hub.inference._mcp integration and the real `mcp` package too.
# Several of those third-party files use `match`, a 3.10+ syntax feature, so
# mypy's py39 parser hard-crashes while descending into them -- before any
# of our own files are even type-checked, and regardless of which one is
# skipped first, since the next transitive dependency hits the same wall.
# `ignore_missing_imports` doesn't help here: these modules ARE found, just
# unparsable at py39. helpmate-api's own code (fully covered by `files`
# above) is unaffected either way. Rather than blanket-skip import-following
# for every third-party module (which would silently make uvicorn and
# helpmate_web imports Any too, even though neither is in the crash chain),
# scope the skip to just the modules that actually crash the py39 parser:
# huggingface_hub (source of the TYPE_CHECKING chain), mcp (the optional
# integration it reaches), and anyio/starlette/fastapi (the transitive
# dependencies that use `match` themselves).
[[tool.mypy.overrides]]
module = ["huggingface_hub.*", "mcp.*", "anyio.*", "starlette.*", "fastapi.*"]
follow_imports = "skip"
