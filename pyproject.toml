[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "helpmate"
version = "0.5.0"
description = "Helpmate tablebases: cooperative mate distances and solution counts"
requires-python = ">=3.9"
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = ["pytest", "chess>=1.10", "httpx"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "huggingface_hub>=0.23"]

[project.scripts]
helpmate-server = "helpmate_server.main:main"
helpmate-tables = "helpmate_server.tables_cli:main"

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = ["python/helpmate", "server/helpmate_server"]
cmake.define.HELPMATE_PYTHON = "ON"
